services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sourceant
    ports:
      # Loopback only. With SOURCEANT_LOCAL set this publishes an
      # unauthenticated MCP server, which on every interface is a writable
      # endpoint on the LAN.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    networks:
      - sourceant-network
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - MEMORY_ENGINE_URL=${MEMORY_ENGINE_URL:-}
      - MEMORY_ENGINE_KEY=${MEMORY_ENGINE_KEY:-}
    env_file:
      - .env

  db:
    image: postgres:13
    container_name: sourceant-db
    environment:
      POSTGRES_DB: sourceant
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - sourceant-network

  memory:
    image: ghcr.io/trailpad/memory:latest
    profiles: [memory]
    environment:
      MEMORY_DATABASE_URL: postgres://memory:${MEMORY_DB_PASSWORD:-your-database-password-here}@memory-db:5432/memory?sslmode=disable
    depends_on:
      memory-db:
        condition: service_healthy
    networks:
      - sourceant-network

  memory-db:
    image: postgres:17
    profiles: [memory]
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:-your-database-password-here}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - memory-data:/var/lib/postgresql/data
    networks:
      - sourceant-network

  redis:
    image: "redis:latest"
    container_name: sourceant-redis
    ports:
      - "6379:6379"
    networks:
      - sourceant-network
    volumes:
      - redis-data:/data

networks:
  sourceant-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  memory-data:
